<svg xmlns="http://www.w3.org/2000/svg" width="900" height="760" viewBox="0 0 900 760" role="img" aria-labelledby="title desc">
  <title id="title">Rendering esercizio 2 - Registrazione Utente</title>
  <desc id="desc">Mockup della pagina HTML con form registrazione.</desc>
  <rect width="900" height="760" fill="#f6f8fc"/>
  <rect x="130" y="40" width="640" height="680" rx="12" fill="#ffffff" stroke="#cfd8e3"/>
  <text x="160" y="90" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#1f2937">Registrazione Utente</text>

  <g font-family="Arial, sans-serif" font-size="15" fill="#111827">
    <text x="160" y="135">Username *</text>
    <rect x="160" y="145" width="580" height="42" rx="6" fill="#fff" stroke="#9ca3af"/>

    <text x="160" y="220">Email *</text>
    <rect x="160" y="230" width="580" height="42" rx="6" fill="#fff" stroke="#9ca3af"/>

    <text x="160" y="305">Password *</text>
    <rect x="160" y="315" width="580" height="42" rx="6" fill="#fff" stroke="#9ca3af"/>

    <text x="160" y="390">Conferma Password *</text>
    <rect x="160" y="400" width="580" height="42" rx="6" fill="#fff" stroke="#9ca3af"/>

    <text x="160" y="475">Data di nascita *</text>
    <rect x="160" y="485" width="280" height="42" rx="6" fill="#fff" stroke="#9ca3af"/>

    <text x="460" y="475">Classe *</text>
    <rect x="460" y="485" width="280" height="42" rx="6" fill="#fff" stroke="#9ca3af"/>
    <polygon points="710,502 723,502 716.5,512" fill="#6b7280"/>
  </g>

  <rect x="160" y="580" width="210" height="46" rx="8" fill="#16a34a"/>
  <text x="215" y="609" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#ffffff">Crea account</text>

  <text x="160" y="660" font-family="Arial, sans-serif" font-size="13" fill="#6b7280">Validazioni HTML: required, minlength e maxlength</text>
</svg>