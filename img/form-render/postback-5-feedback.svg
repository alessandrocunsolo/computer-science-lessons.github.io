<svg xmlns="http://www.w3.org/2000/svg" width="900" height="820" viewBox="0 0 900 820" role="img" aria-labelledby="title desc">
  <title id="title">Esercizio 5 - Modulo di Feedback (Postback)</title>
  <desc id="desc">Mockup con form feedback complesso e riepilogo nella stessa pagina.</desc>
  <rect width="900" height="820" fill="#f4f7fc"/>

  <!-- Card principale -->
  <rect x="50" y="30" width="800" height="760" rx="12" fill="#ffffff" stroke="#cfd8e3"/>

  <!-- Header -->
  <text x="80" y="72" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#1f2937">feedback.php</text>
  <text x="80" y="96" font-family="Arial, sans-serif" font-size="13" fill="#6b7280">Modulo valutazione corso — form + risultato nella stessa pagina (Postback — POST)</text>
  <rect x="658" y="55" width="88" height="22" rx="11" fill="#dbeafe"/>
  <text x="673" y="70" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#1d4ed8">POSTBACK</text>

  <!-- Errore banner (arancione) -->
  <rect x="80" y="116" width="740" height="60" rx="8" fill="#fff7ed" stroke="#fed7aa"/>
  <text x="100" y="143" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#9a3412">Errori di validazione:</text>
  <text x="100" y="163" font-family="Arial, sans-serif" font-size="12" fill="#7c2d12">— Nome obbligatorio   — Valutazione richiesta   — Devi accettare il consenso</text>

  <!-- Form panel -->
  <rect x="80" y="196" width="740" height="390" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>

  <!-- Nome -->
  <text x="100" y="228" font-family="Arial, sans-serif" font-size="13" fill="#374151">Nome *</text>
  <rect x="100" y="236" width="360" height="34" rx="6" fill="#fff" stroke="#ef4444"/>
  <text x="116" y="258" font-family="Arial, sans-serif" font-size="12" fill="#9ca3af">Campo obbligatorio</text>
  <text x="470" y="258" font-family="Arial, sans-serif" font-size="11" fill="#ef4444">— Campo obbligatorio</text>

  <!-- Valutazione radio -->
  <text x="100" y="292" font-family="Arial, sans-serif" font-size="13" fill="#374151">Valutazione generale *</text>
  <circle cx="116" cy="312" r="7" fill="#fff" stroke="#9ca3af"/>
  <text x="128" y="317" font-family="Arial, sans-serif" font-size="12" fill="#374151">1</text>
  <circle cx="168" cy="312" r="7" fill="#fff" stroke="#9ca3af"/>
  <text x="180" y="317" font-family="Arial, sans-serif" font-size="12" fill="#374151">2</text>
  <circle cx="220" cy="312" r="7" fill="#2563eb" stroke="#2563eb"/>
  <circle cx="220" cy="312" r="3" fill="#fff"/>
  <text x="232" y="317" font-family="Arial, sans-serif" font-size="12" fill="#374151">3</text>
  <circle cx="272" cy="312" r="7" fill="#fff" stroke="#9ca3af"/>
  <text x="284" y="317" font-family="Arial, sans-serif" font-size="12" fill="#374151">4</text>
  <circle cx="324" cy="312" r="7" fill="#fff" stroke="#9ca3af"/>
  <text x="336" y="317" font-family="Arial, sans-serif" font-size="12" fill="#374151">5</text>

  <!-- Aspetti positivi checkboxes -->
  <text x="100" y="352" font-family="Arial, sans-serif" font-size="13" fill="#374151">Aspetti positivi</text>
  <rect x="100" y="362" width="14" height="14" rx="3" fill="#2563eb" stroke="#2563eb"/>
  <text x="118" y="374" font-family="Arial, sans-serif" font-size="12" fill="#374151">Chiarezza</text>
  <rect x="210" y="362" width="14" height="14" rx="3" fill="#2563eb" stroke="#2563eb"/>
  <text x="228" y="374" font-family="Arial, sans-serif" font-size="12" fill="#374151">Esempi pratici</text>
  <rect x="346" y="362" width="14" height="14" rx="3" fill="#fff" stroke="#9ca3af"/>
  <text x="364" y="374" font-family="Arial, sans-serif" font-size="12" fill="#374151">Materiale didattico</text>
  <rect x="510" y="362" width="14" height="14" rx="3" fill="#fff" stroke="#9ca3af"/>
  <text x="528" y="374" font-family="Arial, sans-serif" font-size="12" fill="#374151">Ritmo delle lezioni</text>

  <!-- Commento textarea -->
  <text x="100" y="408" font-family="Arial, sans-serif" font-size="13" fill="#374151">Commento libero (max 300 caratteri, facoltativo)</text>
  <rect x="100" y="416" width="720" height="80" rx="6" fill="#fff" stroke="#9ca3af"/>
  <text x="116" y="440" font-family="Arial, sans-serif" font-size="12" fill="#9ca3af">Ottimo corso, spiegazioni molto chiare...</text>
  <text x="760" y="494" font-family="Arial, sans-serif" font-size="10" fill="#9ca3af">42/300</text>

  <!-- Consenso checkbox -->
  <rect x="100" y="512" width="14" height="14" rx="3" fill="#fff" stroke="#ef4444"/>
  <text x="120" y="524" font-family="Arial, sans-serif" font-size="12" fill="#374151">Acconsento alla pubblicazione del mio feedback *</text>

  <!-- Submit button -->
  <rect x="100" y="546" width="160" height="36" rx="8" fill="#2563eb"/>
  <text x="121" y="569" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#fff">Invia Feedback</text>

  <!-- Success riepilogo (verde) -->
  <rect x="80" y="606" width="740" height="140" rx="8" fill="#ecfdf5" stroke="#86efac"/>
  <text x="100" y="636" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#065f46">✅  Feedback ricevuto — Riepilogo</text>
  <text x="100" y="664" font-family="Arial, sans-serif" font-size="13" fill="#1f2937">Nome: Mario</text>
  <text x="100" y="686" font-family="Arial, sans-serif" font-size="13" fill="#1f2937">Valutazione: 3 / 5</text>
  <text x="100" y="708" font-family="Arial, sans-serif" font-size="13" fill="#1f2937">Aspetti: Chiarezza, Esempi pratici</text>
  <text x="400" y="664" font-family="Arial, sans-serif" font-size="13" fill="#1f2937">Commento: "Ottimo corso..."</text>
  <text x="400" y="686" font-family="Arial, sans-serif" font-size="13" fill="#1f2937">Consenso: sì</text>
  <text x="100" y="737" font-family="Arial, sans-serif" font-size="10" fill="#6b7280">Il banner arancione e il riepilogo verde non appaiono insieme — sono due stati alternativi</text>
</svg>
