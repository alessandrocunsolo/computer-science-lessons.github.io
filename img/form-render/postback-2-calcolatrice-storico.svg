<svg xmlns="http://www.w3.org/2000/svg" width="840" height="730" viewBox="0 0 840 730" role="img" aria-labelledby="title desc">
  <title id="title">Esercizio 2 - Calcolatrice con Storico Sessione (Postback)</title>
  <desc id="desc">Mockup con form, risultato operazione e storico sessione nella stessa pagina.</desc>
  <rect width="840" height="730" fill="#f4f7fc"/>

  <!-- Card principale -->
  <rect x="50" y="30" width="740" height="670" rx="12" fill="#ffffff" stroke="#cfd8e3"/>

  <!-- Header -->
  <text x="80" y="72" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#1f2937">calcolatrice.php</text>
  <text x="80" y="96" font-family="Arial, sans-serif" font-size="13" fill="#6b7280">Postback POST + storico operazioni in sessione (session_start)</text>
  <rect x="588" y="55" width="88" height="22" rx="11" fill="#dbeafe"/>
  <text x="603" y="70" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#1d4ed8">POSTBACK</text>

  <!-- Form panel -->
  <rect x="80" y="116" width="680" height="120" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="100" y="149" font-family="Arial, sans-serif" font-size="13" fill="#374151">Numero 1</text>
  <rect x="100" y="157" width="155" height="36" rx="6" fill="#fff" stroke="#9ca3af"/>
  <text x="116" y="180" font-family="Arial, sans-serif" font-size="13" fill="#374151">3</text>

  <text x="276" y="149" font-family="Arial, sans-serif" font-size="13" fill="#374151">Operatore</text>
  <rect x="276" y="157" width="110" height="36" rx="6" fill="#fff" stroke="#9ca3af"/>
  <text x="292" y="180" font-family="Arial, sans-serif" font-size="13" fill="#374151">×  ▾</text>

  <text x="410" y="149" font-family="Arial, sans-serif" font-size="13" fill="#374151">Numero 2</text>
  <rect x="410" y="157" width="155" height="36" rx="6" fill="#fff" stroke="#9ca3af"/>
  <text x="426" y="180" font-family="Arial, sans-serif" font-size="13" fill="#374151">4</text>

  <rect x="590" y="157" width="115" height="36" rx="8" fill="#2563eb"/>
  <text x="615" y="180" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#fff">Calcola</text>

  <!-- Risultato ultima operazione -->
  <rect x="80" y="256" width="680" height="80" rx="8" fill="#eef6ff" stroke="#93c5fd"/>
  <text x="100" y="288" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#1e40af">Ultima operazione</text>
  <text x="100" y="318" font-family="Arial, sans-serif" font-size="16" fill="#1f2937">3 × 4 = 12</text>
  <text x="620" y="318" font-family="Arial, sans-serif" font-size="11" fill="#9ca3af">Errore: divisione per 0 → messaggio</text>

  <!-- Storico sessione -->
  <rect x="80" y="356" width="680" height="240" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="100" y="385" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#334155">Storico sessione</text>
  <text x="600" y="385" font-family="Arial, sans-serif" font-size="11" fill="#6b7280">dalla più recente</text>

  <!-- History row 1 (more recent) -->
  <rect x="100" y="396" width="640" height="36" rx="5" fill="#fff" stroke="#e2e8f0"/>
  <text x="120" y="419" font-family="Arial, sans-serif" font-size="13" fill="#1f2937">3 × 4 = 12</text>
  <text x="670" y="419" font-family="Arial, sans-serif" font-size="10" fill="#6b7280">più recente</text>

  <!-- History row 2 -->
  <rect x="100" y="442" width="640" height="36" rx="5" fill="#fff" stroke="#e2e8f0"/>
  <text x="120" y="465" font-family="Arial, sans-serif" font-size="13" fill="#1f2937">15 + 8 = 23</text>

  <!-- History row 3 -->
  <rect x="100" y="488" width="640" height="36" rx="5" fill="#fff" stroke="#e2e8f0"/>
  <text x="120" y="511" font-family="Arial, sans-serif" font-size="13" fill="#1f2937">10 / 2 = 5</text>

  <!-- Empty state note -->
  <text x="100" y="558" font-family="Arial, sans-serif" font-size="11" fill="#9ca3af">Se storico vuoto → "Nessuna operazione nello storico"</text>

  <!-- Svuota link -->
  <rect x="80" y="615" width="680" height="1" fill="#e5e7eb"/>
  <text x="100" y="645" font-family="Arial, sans-serif" font-size="13" fill="#2563eb">Svuota storico</text>
  <text x="220" y="645" font-family="Arial, sans-serif" font-size="12" fill="#6b7280">→ link GET con parametro ?azione=reset (reimposta $_SESSION['storico'])</text>
</svg>
