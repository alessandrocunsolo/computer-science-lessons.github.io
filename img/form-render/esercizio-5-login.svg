  <rect x="550" y="150" width="410" height="120" rx="8" fill="#fff7ed" stroke="#fed7aa"/>
  <text x="572" y="190" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#9a3412">Credenziali non corrette</text>
