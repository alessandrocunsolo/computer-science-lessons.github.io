<svg xmlns="http://www.w3.org/2000/svg" width="980" height="660" viewBox="0 0 980 660" role="img" aria-labelledby="title desc">
  <title id="title">Esercizio 3 - Maggiore e minore con pagina risultato separata</title>
  <desc id="desc">Mockup della pagina confronto e della pagina risultato.</desc>
  <rect width="980" height="660" fill="#f5f8fc"/>

  <rect x="40" y="40" width="430" height="580" rx="12" fill="#fff" stroke="#cfd8e3"/>
  <text x="65" y="82" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#1f2937">confronto_numeri.php</text>
  <text x="65" y="108" font-family="Arial, sans-serif" font-size="14" fill="#6b7280">Form di confronto</text>

  <text x="65" y="160" font-family="Arial, sans-serif" font-size="14" fill="#111827">Numero 1</text>
  <rect x="65" y="171" width="380" height="40" rx="6" fill="#fff" stroke="#9ca3af"/>
  <text x="65" y="240" font-family="Arial, sans-serif" font-size="14" fill="#111827">Numero 2</text>
  <rect x="65" y="251" width="380" height="40" rx="6" fill="#fff" stroke="#9ca3af"/>
  <rect x="65" y="320" width="190" height="40" rx="8" fill="#2563eb"/>
  <text x="124" y="345" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#fff">Confronta</text>

  <text x="485" y="325" font-family="Arial, sans-serif" font-size="28" fill="#64748b">→</text>

  <rect x="510" y="40" width="430" height="580" rx="12" fill="#fff" stroke="#cfd8e3"/>
  <text x="535" y="82" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#1f2937">risultato_confronto.php</text>
  <text x="535" y="108" font-family="Arial, sans-serif" font-size="14" fill="#6b7280">Risultati del confronto</text>

  <rect x="535" y="165" width="380" height="90" rx="8" fill="#eef2ff" stroke="#c7d2fe"/>
  <text x="560" y="214" font-family="Arial, sans-serif" font-size="16" fill="#1f2937">Numero maggiore: 27</text>

  <rect x="535" y="275" width="380" height="90" rx="8" fill="#fff7ed" stroke="#fed7aa"/>
