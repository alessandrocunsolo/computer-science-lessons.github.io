<svg xmlns="http://www.w3.org/2000/svg" width="820" height="590" viewBox="0 0 820 590" role="img" aria-labelledby="title desc">
  <title id="title">Esercizio 3 - Valutazione Forza Password (Postback)</title>
  <desc id="desc">Mockup con form password e analisi criteri nella stessa pagina.</desc>
  <rect width="820" height="590" fill="#f4f7fc"/>

  <!-- Card principale -->
  <rect x="50" y="30" width="720" height="530" rx="12" fill="#ffffff" stroke="#cfd8e3"/>

  <!-- Header -->
  <text x="80" y="72" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#1f2937">valuta_password.php</text>
  <text x="80" y="96" font-family="Arial, sans-serif" font-size="13" fill="#6b7280">Form + analisi criteri nella stessa pagina (Postback — POST)</text>
  <rect x="572" y="55" width="88" height="22" rx="11" fill="#dbeafe"/>
  <text x="587" y="70" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#1d4ed8">POSTBACK</text>

  <!-- Form panel -->
  <rect x="80" y="116" width="660" height="110" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="100" y="149" font-family="Arial, sans-serif" font-size="13" fill="#374151">Password (visibile per analisi)</text>
  <rect x="100" y="157" width="410" height="36" rx="6" fill="#fff" stroke="#9ca3af"/>
  <text x="116" y="180" font-family="Arial, sans-serif" font-size="13" fill="#374151">Str0ngPass!</text>
  <rect x="530" y="157" width="130" height="36" rx="8" fill="#2563eb"/>
  <text x="558" y="180" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#fff">Analizza</text>
  <text x="100" y="207" font-family="Arial, sans-serif" font-size="11" fill="#9ca3af">Il campo non viene ripopolato dopo l'invio (sicurezza)</text>

  <!-- Risultato analisi -->
  <rect x="80" y="246" width="660" height="265" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>

  <!-- Score header -->
  <text x="100" y="282" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#334155">Punteggio:  </text>
  <text x="210" y="282" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#1f2937">3 / 4</text>
  <rect x="300" y="264" width="75" height="24" rx="12" fill="#dcfce7" stroke="#86efac"/>
  <text x="316" y="280" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#166534">Buona</text>

  <!-- criteria -->
  <text x="110" y="322" font-family="Arial, sans-serif" font-size="15" fill="#16a34a">✅</text>
  <text x="140" y="322" font-family="Arial, sans-serif" font-size="13" fill="#1f2937">Lunghezza ≥ 8 caratteri</text>

  <text x="110" y="356" font-family="Arial, sans-serif" font-size="15" fill="#16a34a">✅</text>
  <text x="140" y="356" font-family="Arial, sans-serif" font-size="13" fill="#1f2937">Contiene almeno una lettera maiuscola</text>

  <text x="110" y="390" font-family="Arial, sans-serif" font-size="15" fill="#16a34a">✅</text>
  <text x="140" y="390" font-family="Arial, sans-serif" font-size="13" fill="#1f2937">Contiene almeno una cifra</text>

  <text x="110" y="424" font-family="Arial, sans-serif" font-size="15" fill="#dc2626">❌</text>
  <text x="140" y="424" font-family="Arial, sans-serif" font-size="13" fill="#6b7280">Contiene almeno un carattere speciale  (!  @  #  $  %  …)</text>

  <!-- Judgment badges scale -->
  <text x="100" y="466" font-family="Arial, sans-serif" font-size="11" fill="#9ca3af">Giudizi: </text>
  <rect x="160" y="452" width="82" height="20" rx="10" fill="#fee2e2"/>
  <text x="170" y="466" font-family="Arial, sans-serif" font-size="11" fill="#991b1b">Molto debole</text>
  <rect x="250" y="452" width="54" height="20" rx="10" fill="#fef9c3"/>
  <text x="263" y="466" font-family="Arial, sans-serif" font-size="11" fill="#854d0e">Debole</text>
  <rect x="312" y="452" width="48" height="20" rx="10" fill="#dcfce7"/>
  <text x="320" y="466" font-family="Arial, sans-serif" font-size="11" fill="#166534">Buona</text>
  <rect x="368" y="452" width="46" height="20" rx="10" fill="#d1fae5"/>
  <text x="377" y="466" font-family="Arial, sans-serif" font-size="11" fill="#065f46">Ottima</text>

  <!-- Error state note -->
  <text x="80" y="536" font-family="Arial, sans-serif" font-size="11" fill="#9ca3af">Se campo vuoto → messaggio di validazione; il campo password non viene mai ripopolato</text>
</svg>
