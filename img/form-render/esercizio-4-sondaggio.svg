<svg xmlns="http://www.w3.org/2000/svg" width="940" height="840" viewBox="0 0 940 840" role="img" aria-labelledby="title desc">
  <title id="title">Rendering esercizio 4 - Sondaggio Tecnologie Web</title>
  <desc id="desc">Mockup con radio, checkbox, range e area commenti.</desc>
  <rect width="940" height="840" fill="#f7f8fc"/>
  <rect x="120" y="40" width="700" height="760" rx="12" fill="#ffffff" stroke="#cfd8e3"/>
  <text x="155" y="90" font-family="Arial, sans-serif" font-size="29" font-weight="700" fill="#1f2937">Sondaggio Tecnologie Web</text>

  <text x="155" y="145" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#111827">Quale linguaggio preferisci?</text>
  <g font-family="Arial, sans-serif" font-size="15" fill="#111827">
    <circle cx="165" cy="180" r="9" fill="#fff" stroke="#6b7280"/><text x="185" y="186">HTML</text>
    <circle cx="165" cy="215" r="9" fill="#fff" stroke="#6b7280"/><text x="185" y="221">CSS</text>
    <circle cx="165" cy="250" r="9" fill="#fff" stroke="#6b7280"/><text x="185" y="256">JavaScript</text>
    <circle cx="165" cy="285" r="9" fill="#fff" stroke="#6b7280"/><text x="185" y="291">PHP</text>
  </g>

  <text x="155" y="340" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#111827">Quali strumenti usi?</text>
  <g font-family="Arial, sans-serif" font-size="15" fill="#111827">
    <rect x="156" y="365" width="18" height="18" rx="3" fill="#fff" stroke="#6b7280"/><text x="185" y="379">VS Code</text>
    <rect x="156" y="398" width="18" height="18" rx="3" fill="#fff" stroke="#6b7280"/><text x="185" y="412">Git</text>
    <rect x="156" y="431" width="18" height="18" rx="3" fill="#fff" stroke="#6b7280"/><text x="185" y="445">Figma</text>
    <rect x="156" y="464" width="18" height="18" rx="3" fill="#fff" stroke="#6b7280"/><text x="185" y="478">XAMPP</text>
    <rect x="156" y="497" width="18" height="18" rx="3" fill="#fff" stroke="#6b7280"/><text x="185" y="511">Browser DevTools</text>
  </g>

  <text x="155" y="560" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#111827">Interesse verso il web development (1-10)</text>
  <line x1="160" y1="590" x2="620" y2="590" stroke="#9ca3af" stroke-width="6" stroke-linecap="round"/>
  <circle cx="445" cy="590" r="12" fill="#2563eb"/>
  <text x="640" y="596" font-family="Arial, sans-serif" font-size="15" fill="#111827">7/10</text>

  <text x="155" y="640" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#111827">Commenti</text>
  <rect x="155" y="652" width="630" height="55" rx="6" fill="#fff" stroke="#9ca3af"/>

  <rect x="155" y="755" width="200" height="40" rx="8" fill="#2563eb"/>
  <text x="206" y="780" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#fff">Invia sondaggio</text>
  <rect x="370" y="755" width="140" height="40" rx="8" fill="#e5e7eb" stroke="#9ca3af"/>
  <text x="418" y="780" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#374151">Reset</text>
