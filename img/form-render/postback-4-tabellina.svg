<svg xmlns="http://www.w3.org/2000/svg" width="820" height="680" viewBox="0 0 820 680" role="img" aria-labelledby="title desc">
  <title id="title">Esercizio 4 - Generatore Tabella di Moltiplicazione (Postback)</title>
  <desc id="desc">Mockup con form e tabella moltiplicazione generata nella stessa pagina.</desc>
  <rect width="820" height="680" fill="#f4f7fc"/>

  <!-- Card principale -->
  <rect x="50" y="30" width="720" height="620" rx="12" fill="#ffffff" stroke="#cfd8e3"/>

  <!-- Header -->
  <text x="80" y="72" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#1f2937">tabellina.php</text>
  <text x="80" y="96" font-family="Arial, sans-serif" font-size="13" fill="#6b7280">Generazione tabella di moltiplicazione nella stessa pagina (Postback — POST)</text>
  <rect x="572" y="55" width="88" height="22" rx="11" fill="#dbeafe"/>
  <text x="587" y="70" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#1d4ed8">POSTBACK</text>

  <!-- Form panel -->
  <rect x="80" y="116" width="660" height="110" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="100" y="149" font-family="Arial, sans-serif" font-size="13" fill="#374151">Numero</text>
  <rect x="100" y="157" width="140" height="36" rx="6" fill="#fff" stroke="#9ca3af"/>
  <text x="116" y="180" font-family="Arial, sans-serif" font-size="13" fill="#374151">7</text>
  <text x="100" y="213" font-family="Arial, sans-serif" font-size="10" fill="#9ca3af">min 1, max 20</text>

  <text x="270" y="149" font-family="Arial, sans-serif" font-size="13" fill="#374151">Da 1 a</text>
  <rect x="270" y="157" width="140" height="36" rx="6" fill="#fff" stroke="#9ca3af"/>
  <text x="286" y="180" font-family="Arial, sans-serif" font-size="13" fill="#374151">10</text>
  <text x="270" y="213" font-family="Arial, sans-serif" font-size="10" fill="#9ca3af">min 1, max 20 (default 10)</text>

  <rect x="450" y="157" width="130" height="36" rx="8" fill="#2563eb"/>
  <text x="483" y="180" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#fff">Genera</text>

  <!-- Tabella -->
  <rect x="80" y="246" width="660" height="356" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>

  <!-- Intestazione tabella -->
  <rect x="80" y="246" width="660" height="36" rx="8" fill="#e2e8f0"/>
  <text x="200" y="269" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#334155">Moltiplicazione</text>
  <text x="550" y="269" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#334155">Risultato</text>

  <!-- Righe tabella -->
  <rect x="80" y="282" width="660" height="30" fill="#fff" stroke="#e2e8f0"/>
  <text x="200" y="302" font-family="Arial, sans-serif" font-size="13" fill="#1f2937">7  ×  1</text>
  <text x="555" y="302" font-family="Arial, sans-serif" font-size="13" fill="#1f2937">7</text>

  <rect x="80" y="312" width="660" height="30" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="200" y="332" font-family="Arial, sans-serif" font-size="13" fill="#1f2937">7  ×  2</text>
  <text x="555" y="332" font-family="Arial, sans-serif" font-size="13" fill="#1f2937">14</text>

  <rect x="80" y="342" width="660" height="30" fill="#fff" stroke="#e2e8f0"/>
  <text x="200" y="362" font-family="Arial, sans-serif" font-size="13" fill="#1f2937">7  ×  3</text>
  <text x="555" y="362" font-family="Arial, sans-serif" font-size="13" fill="#1f2937">21</text>

  <rect x="80" y="372" width="660" height="30" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="200" y="392" font-family="Arial, sans-serif" font-size="13" fill="#1f2937">7  ×  4</text>
  <text x="555" y="392" font-family="Arial, sans-serif" font-size="13" fill="#1f2937">28</text>

  <rect x="80" y="402" width="660" height="30" fill="#fff" stroke="#e2e8f0"/>
  <text x="200" y="422" font-family="Arial, sans-serif" font-size="13" fill="#1f2937">7  ×  5</text>
  <text x="555" y="422" font-family="Arial, sans-serif" font-size="13" fill="#1f2937">35</text>

  <text x="300" y="462" font-family="Arial, sans-serif" font-size="14" fill="#9ca3af">…</text>

  <!-- Riga evidenziata (multiplo di 10) -->
  <rect x="80" y="480" width="660" height="36" fill="#dbeafe" stroke="#93c5fd"/>
  <text x="200" y="503" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#1e40af">7  ×  10</text>
  <text x="555" y="503" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#1e40af">70</text>
  <text x="640" y="503" font-family="Arial, sans-serif" font-size="10" fill="#1d4ed8">multiplo di 10</text>

  <!-- Nota grassetto -->
  <text x="100" y="560" font-family="Arial, sans-serif" font-size="11" fill="#6b7280">I risultati multipli di 10 sono evidenziati in grassetto</text>

  <!-- Error note -->
  <text x="80" y="613" font-family="Arial, sans-serif" font-size="11" fill="#9ca3af">Se campi fuori dal range (1–20) → errore; campi ripopolati dopo l'invio</text>
</svg>
