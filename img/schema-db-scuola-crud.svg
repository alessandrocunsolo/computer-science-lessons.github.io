<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img" aria-labelledby="title desc">
  <title id="title">Schema DB scuola_crud</title>
  <desc id="desc">Schema entita-relazioni del database scuola_crud con tabelle docenti, studenti, corsi e iscrizioni.</desc>

  <defs>
    <style>
      .bg { fill: #f4f7fc; }
      .card { fill: #ffffff; stroke: #cfd8e3; stroke-width: 1.5; }
      .head { fill: #e2e8f0; }
      .title { font-family: Arial, sans-serif; font-size: 18px; font-weight: 700; fill: #1f2937; }
      .text { font-family: Arial, sans-serif; font-size: 13px; fill: #374151; }
      .meta { font-family: Arial, sans-serif; font-size: 11px; fill: #6b7280; }
      .pk { fill: #dbeafe; }
      .fk { fill: #dcfce7; }
      .uk { fill: #fef9c3; }
      .line { stroke: #475569; stroke-width: 2; fill: none; }
      .label { font-family: Arial, sans-serif; font-size: 12px; fill: #334155; font-weight: 700; }
    </style>

    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#475569" />
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1280" height="760" />
  <text x="40" y="42" class="title">Schema ER - Database scuola_crud</text>
  <text x="40" y="62" class="meta">Tabelle: docenti, studenti, corsi, iscrizioni | PK/FK/UNIQUE e relazioni 1-N</text>

  <!-- DOCENTI -->
  <g transform="translate(40,100)">
    <rect class="card" x="0" y="0" width="360" height="250" rx="10" />
    <rect class="head" x="0" y="0" width="360" height="42" rx="10" />
    <text x="16" y="27" class="title">DOCENTI</text>

    <rect class="pk" x="12" y="56" width="336" height="24" rx="5" />
    <text x="20" y="72" class="text">id (PK) - INT UNSIGNED AUTO_INCREMENT</text>

    <text x="20" y="98" class="text">nome - VARCHAR(80) NOT NULL</text>
    <text x="20" y="122" class="text">cognome - VARCHAR(80) NOT NULL</text>

    <rect class="uk" x="12" y="132" width="336" height="24" rx="5" />
    <text x="20" y="148" class="text">email (UNIQUE) - VARCHAR(120) NOT NULL</text>

    <text x="20" y="174" class="text">materia - VARCHAR(100) NOT NULL</text>
    <text x="20" y="198" class="meta">created_at, updated_at (TIMESTAMP)</text>
  </g>

  <!-- CORSI -->
  <g transform="translate(460,100)">
    <rect class="card" x="0" y="0" width="380" height="292" rx="10" />
    <rect class="head" x="0" y="0" width="380" height="42" rx="10" />
    <text x="16" y="27" class="title">CORSI</text>

    <rect class="pk" x="12" y="56" width="356" height="24" rx="5" />
    <text x="20" y="72" class="text">id (PK) - INT UNSIGNED AUTO_INCREMENT</text>

    <text x="20" y="98" class="text">titolo - VARCHAR(150) NOT NULL</text>

    <rect class="uk" x="12" y="108" width="356" height="24" rx="5" />
    <text x="20" y="124" class="text">codice (UNIQUE) - VARCHAR(30) NOT NULL</text>

    <text x="20" y="150" class="text">descrizione - TEXT NULL</text>
    <text x="20" y="174" class="text">ore_totali - SMALLINT UNSIGNED NOT NULL</text>

    <rect class="fk" x="12" y="184" width="356" height="24" rx="5" />
    <text x="20" y="200" class="text">docente_id (FK) - INT UNSIGNED NULL</text>

    <text x="20" y="226" class="meta">FK: docente_id -> docenti.id (ON DELETE SET NULL)</text>
    <text x="20" y="246" class="meta">CHECK: ore_totali &gt; 0</text>
    <text x="20" y="266" class="meta">created_at, updated_at (TIMESTAMP)</text>
  </g>

  <!-- STUDENTI -->
  <g transform="translate(40,410)">
    <rect class="card" x="0" y="0" width="360" height="280" rx="10" />
    <rect class="head" x="0" y="0" width="360" height="42" rx="10" />
    <text x="16" y="27" class="title">STUDENTI</text>

    <rect class="pk" x="12" y="56" width="336" height="24" rx="5" />
    <text x="20" y="72" class="text">id (PK) - INT UNSIGNED AUTO_INCREMENT</text>

    <text x="20" y="98" class="text">nome - VARCHAR(80) NOT NULL</text>
    <text x="20" y="122" class="text">cognome - VARCHAR(80) NOT NULL</text>

    <rect class="uk" x="12" y="132" width="336" height="24" rx="5" />
    <text x="20" y="148" class="text">email (UNIQUE) - VARCHAR(120) NOT NULL</text>

    <text x="20" y="174" class="text">data_nascita - DATE NULL</text>
    <text x="20" y="198" class="text">classe - VARCHAR(20) NULL</text>
    <text x="20" y="224" class="meta">created_at, updated_at (TIMESTAMP)</text>
  </g>

  <!-- ISCRIZIONI -->
  <g transform="translate(900,260)">
    <rect class="card" x="0" y="0" width="340" height="320" rx="10" />
    <rect class="head" x="0" y="0" width="340" height="42" rx="10" />
    <text x="16" y="27" class="title">ISCRIZIONI</text>

    <rect class="pk" x="12" y="56" width="316" height="24" rx="5" />
    <text x="20" y="72" class="text">id (PK) - INT UNSIGNED AUTO_INCREMENT</text>

    <rect class="fk" x="12" y="88" width="316" height="24" rx="5" />
    <text x="20" y="104" class="text">studente_id (FK) - INT UNSIGNED NOT NULL</text>

    <rect class="fk" x="12" y="120" width="316" height="24" rx="5" />
    <text x="20" y="136" class="text">corso_id (FK) - INT UNSIGNED NOT NULL</text>

    <text x="20" y="162" class="text">data_iscrizione - DATE NOT NULL</text>
    <text x="20" y="186" class="text">stato - ENUM(attiva, completata, ritirata)</text>
    <text x="20" y="210" class="text">voto_finale - TINYINT UNSIGNED NULL</text>

    <rect class="uk" x="12" y="220" width="316" height="24" rx="5" />
    <text x="20" y="236" class="text">UNIQUE (studente_id, corso_id)</text>

    <text x="20" y="262" class="meta">FK: studente_id -> studenti.id (RESTRICT)</text>
    <text x="20" y="280" class="meta">FK: corso_id -> corsi.id (RESTRICT)</text>
    <text x="20" y="298" class="meta">CHECK: voto_finale NULL o tra 18 e 30</text>
  </g>

  <!-- Relazione DOCENTI 1-N CORSI -->
  <path class="line" d="M400 200 C430 200, 430 200, 460 200" marker-end="url(#arrow)" />
  <text x="414" y="188" class="label">1</text>
  <text x="438" y="188" class="label">N</text>
  <text x="410" y="218" class="meta">assegna</text>

  <!-- Relazione STUDENTI 1-N ISCRIZIONI -->
  <path class="line" d="M400 560 C610 560, 680 560, 900 420" marker-end="url(#arrow)" />
  <text x="510" y="576" class="label">1</text>
  <text x="848" y="446" class="label">N</text>
  <text x="612" y="548" class="meta">ha iscrizioni</text>

  <!-- Relazione CORSI 1-N ISCRIZIONI -->
  <path class="line" d="M840 250 C880 250, 890 300, 900 330" marker-end="url(#arrow)" />
  <text x="850" y="240" class="label">1</text>
  <text x="887" y="322" class="label">N</text>
  <text x="860" y="274" class="meta">include</text>

  <!-- Legend -->
  <g transform="translate(460,430)">
    <rect class="card" x="0" y="0" width="380" height="130" rx="10" />
    <text x="14" y="24" class="title">Legenda</text>

    <rect class="pk" x="16" y="38" width="18" height="18" rx="3" />
    <text x="42" y="52" class="text">PK = Chiave primaria</text>

    <rect class="fk" x="16" y="64" width="18" height="18" rx="3" />
    <text x="42" y="78" class="text">FK = Chiave esterna</text>

    <rect class="uk" x="16" y="90" width="18" height="18" rx="3" />
    <text x="42" y="104" class="text">UK = Vincolo UNIQUE</text>

    <text x="220" y="52" class="meta">1-N: una entita padre ha</text>
    <text x="220" y="70" class="meta">molti record figli</text>
  </g>
</svg>
